<!doctype html><html><head><meta charset="utf-8"><title>Motion layout verification</title></head><body style="font:14px monospace;background:#f4f4ee"><h1>Motion layout verification</h1><button id="run">Run checks</button><pre id="result" role="status">Ready</pre><div id="fixture" style="width:960px;height:540px"></div><script type="module">
import {SHOTS,renderShot,loadAppFont,createMotionPlayer} from '../src/player.js';
import {preloadMedia} from '../src/media.js';
import {SHOT_VARIANTS} from '../src/variants.js';
import {makeProfile} from '../src/data/profiles.js';
const output=document.querySelector('#result'),fixture=document.querySelector('#fixture');
async function run(){const errors=[],checks=[],overflow=[];let rendered=0;output.textContent='Running…';
for(const profile of ['wireframe','forma','atlas']){const p=makeProfile(profile);await loadAppFont(p);for(const shot of SHOTS){for(const v of SHOT_VARIANTS[shot.id]){for(let frame=0;frame<shot.frames;frame++){const svg=renderShot(shot.id,frame,p,{variant:v.id});rendered++;if(svg.outerHTML.includes('NaN')||svg.outerHTML.includes('Infinity'))errors.push(`${profile}/${shot.id}/${v.id}/${frame}: invalid geometry`);if(frame===shot.frames-1){fixture.replaceChildren(svg);if(v.id!=='original'){const bounds=svg.getBoundingClientRect();for(const node of svg.querySelectorAll('text')){if(node.closest('[data-decorative],[data-source-crop]'))continue;const slide=node.closest('[data-feature-index]'),gallery=node.closest('[data-feature-gallery]');if(slide&&gallery&&Number(slide.getAttribute('data-feature-index'))!==Number(gallery.getAttribute('data-scroll-index')))continue;const r=node.getBoundingClientRect();if(r.left<bounds.left-1||r.top<bounds.top-1||r.right>bounds.right+1||r.bottom>bounds.bottom+1)overflow.push(`${profile}/${shot.id}/${v.id}: ${node.textContent}`);}}}}}}checks.push(profile+': all layouts rendered at every frame');}
const config={hook:'original',reveal:'original',collage:'original',focus:'original'},player=await createMotionPlayer(fixture,{payload:makeProfile('wireframe'),sequence:SHOTS.map(s=>s.id),variants:config});
for(const [frame,shot]of [[0,'hook'],[36,'reveal'],[72,'collage'],[98,'focus'],[144,'ending']]){player.seekFrame(frame);const state=player.getState();if(state.shot!==shot||state.variant!==(config[shot]??'original'))errors.push('Wrong variant at cut '+frame);}
await player.update(makeProfile('forma'));if(JSON.stringify(player.getVariants())!==JSON.stringify({...config,ending:'original'}))errors.push('Content sync reset variants');
let refused=false;try{player.setVariant('ending','wide');}catch(e){refused=true;}if(!refused)errors.push('Ending accepted a variant');if(player.getState().shot!=='ending')errors.push('Rejected variant changed active shot');
player.seekFrame(179);const final=fixture.querySelector('svg');if(final.querySelectorAll('image').length!==1||!final.textContent.includes('Proudly built on')||final.textContent.includes('Go build your own'))errors.push('End card copy/logo incorrect');
checks.push('Sequence cuts, content swap, fixed ending, invalid selection checked');
const before=player.getPayload(),beforeLayouts=player.getVariants();let bad=structuredClone(before);bad.copy.hook=['Invalid'];let blocked=false;try{await player.applyTemplate({payload:bad,variants:{hook:'karaoke'}});}catch{blocked=true;}if(!blocked||JSON.stringify(player.getPayload())!==JSON.stringify(before)||JSON.stringify(player.getVariants())!==JSON.stringify(beforeLayouts))errors.push('Invalid imported template was not atomic');
await player.applyTemplate({payload:makeProfile('atlas'),variants:{hook:'dark-statement',reveal:'echo-right',collage:'original',focus:'six-day'},wireframe:true});
if(player.getPayload().app.name!=='ATLAS'||player.getVariants().hook!=='original')errors.push('Template did not replace content and layouts together');
const oldUpdate=player.applyTemplate({payload:makeProfile('forma'),variants:{hook:'agency-line'}}),newUpdate=player.applyTemplate({payload:makeProfile('wireframe'),variants:{hook:'karaoke'}});await Promise.all([oldUpdate,newUpdate]);if(player.getPayload().app.name!=='YOUR APP'||player.getVariants().hook!=='original')errors.push('Older template update replaced the latest one');
player.setWireframe(false);if(player.getWireframe()!==false)errors.push('Media mode was not applied');player.setWireframe(true);checks.push('Atomic generated templates, newest update wins, media mode checked');
const withImage=makeProfile('wireframe');withImage.media.hero.src='/assets/base44-logo.svg';await preloadMedia(withImage);withImage.media.hero.src='/this-image-does-not-exist.png';let imageFailed=false;try{await preloadMedia(withImage);}catch{imageFailed=true;}if(!imageFailed)errors.push('Missing media was silently accepted');checks.push('Actual image preloading and failed-image rejection checked');
output.textContent=JSON.stringify({status:errors.length||overflow.length?'FAIL':'PASS',rendered,checks,errors,overflow},null,2);}
document.querySelector('#run').onclick=()=>run().catch(error=>output.textContent=error.stack);
</script></body></html>
