<!doctype html><html><head><meta charset="utf-8"><title>Show off v2 integration checks</title></head><body><h1>Show off v2 integration checks</h1><button id="run">Run v2 checks</button><pre id="result">Ready</pre><div id="fixture" style="width:960px;height:540px"></div><script type="module">
import {payloadFromShowcase,SHOWCASE_SHOTS} from '../src/showcase.js';
import {renderShot,renderSequenceFrame,createMotionPlayer,loadAppFont,FPS,SHOTS} from '../src/player.js';
import {CUT_TYPES,MOTION_SHOTS,MOTION_FIELDS,controlsFor} from '../src/v2/motion-settings.js';
import {SHOT_VARIANTS} from '../src/variants.js';
import {bundleVisuals} from '../src/v2/asset-bundle.js';
import {capabilityCopy} from '../src/v2/capability-motion.js';
import {planSequence} from '../src/v2/model.js';
const result=document.querySelector('#result'),fixture=document.querySelector('#fixture');
document.querySelector('#run').onclick=async()=>{try{
 result.textContent='Running…';const r=await fetch('/api/v2/local-source'),source=r.ok?await r.json():await (await fetch('../examples/v2-wireframe.json')).json(),p=payloadFromShowcase(source),errors=[];p.showcase.motion={version:1,style:'original',shots:{}};await loadAppFont(p);let frames=0;
 for(const shot of SHOWCASE_SHOTS)for(const variant of SHOT_VARIANTS[shot.id==='focus2'||shot.id==='focus3'?'focus':shot.id])for(let frame=0;frame<shot.frames;frame++){const svg=renderShot(shot.id,frame,p,{wireframe:false,variant:variant.id});frames++;if(/NaN|Infinity/.test(svg.outerHTML))errors.push('Invalid geometry '+shot.id+'/'+frame);}
 // Page views must contain the entire supplied screen, including portrait UI.
 for(const shape of [{width:390,height:844},{width:1440,height:900},{width:1000,height:1000}]){
  const fitted=structuredClone(p);fitted.showcase.features.forEach(f=>{f.page={src:'/assets/base44-logo.svg',...shape};});
  for(const id of ['focus','focus2','focus3']){const svg=renderShot(id,12,fitted,{wireframe:false}),page=svg.querySelector('[data-app-page]');if(page.getAttribute('viewBox')!==`0 0 ${shape.width} ${shape.height}`)errors.push('Cropped full page '+id);}
 }
 // Original motion landmarks: the screen opens late; bundle holds; capabilities flip.
 const original=(id,f)=>renderShot(id,f,p,{wireframe:false});
 if(original('hook',21).querySelector('[data-app-page]')||!original('hook',22).querySelector('[data-app-page]'))errors.push('Original app opening changed');
 if(original('capabilities',17).querySelector('[data-benefit]').getAttribute('x')!=='112'||original('capabilities',18).querySelector('[data-benefit]').getAttribute('x')!=='480')errors.push('Original capability flip changed');
 const benefitText=svg=>[...svg.querySelectorAll('[data-benefit]')].map(n=>n.textContent).join(' ');
 for(const [f,second]of [[17,false],[18,true]])if(benefitText(original('capabilities',f))!==capabilityCopy(planSequence(source),second))errors.push('Wrong capability headline');
 // Every grip is attached to the fitted image, not a fixed page-grid point.
 // Parent edits must carry the connectors with the image in both motion modes.
 for(const style of ['original','refined'])for(let f=0;f<36;f++){
  const adjusted=structuredClone(p);adjusted.showcase.motion={version:1,style,shots:{},elements:{capabilities:{'tile-0':{dx:12,dy:-8,sx:1.1,sy:1.1}}}};
  const svg=renderShot('capabilities',f,adjusted,{wireframe:false});
  for(const tile of svg.querySelectorAll('[data-element-id^="tile-"]')){
   const media=tile.querySelector('[data-capability-role]'),grips=[...tile.querySelectorAll('[data-connector-for]')];
   if(!media||grips.length!==4){errors.push('Disconnected capability grips');continue;}
   const x=Number(media.getAttribute('x')),y=Number(media.getAttribute('y')),w=Number(media.getAttribute('width')),h=Number(media.getAttribute('height'));
   const corners=[[x-5,y-5],[x+w-5,y-5],[x-5,y+h-5],[x+w-5,y+h-5]];
   grips.forEach((g,j)=>{if(Math.abs(Number(g.getAttribute('x'))-corners[j][0])>.001||Math.abs(Number(g.getAttribute('y'))-corners[j][1])>.001||g.closest('[data-element-id]')!==tile)errors.push('Grip drifted from image');});
  }
  if(!svg.querySelector('[data-element-id="tile-0"]').getAttribute('transform').includes('12 -8'))errors.push('Connector group lost saved edits');
  const clean=structuredClone(adjusted);clean.showcase.motion.elements={};
  const connected=renderShot('capabilities',f,clean,{wireframe:false}),columns=[[],[]];
  for(const tile of connected.querySelectorAll('[data-element-id^="tile-"]')){
   const i=Number(tile.dataset.elementId.split('-')[1]);columns[i%2].push(tile);
  }
  for(const column of columns)column.slice(1).forEach((tile,j)=>{
   const previous=column[j],a=JSON.parse(previous.dataset.elementBox),b=JSON.parse(tile.dataset.elementBox);
   if(Math.abs(a.y+a.height-b.y)>.001)errors.push('Gap between connected cards');
   for(const side of [0,1]){const upper=previous.querySelector(`[data-connector-corner="${side+2}"]`),lower=tile.querySelector(`[data-connector-corner="${side}"]`);for(const key of ['x','y'])if(Math.abs(Number(upper.getAttribute(key))-Number(lower.getAttribute(key)))>.001)errors.push('Connector joint did not overlap');}
  });
  if(columns.every(c=>c.length)){const a=JSON.parse(columns[0][0].dataset.elementBox),b=JSON.parse(columns[1][0].dataset.elementBox);if(Math.abs(a.x+a.width-b.x)>.001)errors.push('Gap between image columns');}
 }
 if(original('ending',4).querySelector('[data-credit]')||!original('ending',5).querySelector('[data-credit]'))errors.push('Original ending cadence changed');
 // The asset identity and exact source viewport must survive the cut unchanged.
 const tail=original('reveal',41).querySelector('[data-clicked-asset]'),head=original('collage',0).querySelector('[data-clicked-asset]');
 if(source.bundle){
  if(!tail||!head)errors.push('Missing clicked asset handoff');
  else for(const k of ['x','y','width','height','viewBox','data-media','data-clicked-asset'])if(tail.getAttribute(k)!==head.getAttribute(k))errors.push('Asset handoff discontinuity '+k);
  const linked=[...original('collage',17).querySelectorAll('[data-bundle-item]')];
  if(linked.length!==bundleVisuals(source.bundle).length||linked.some(n=>n.dataset.relatedAsset!==source.bundle.assetId&&!source.features.some(f=>f.id===n.dataset.relatedFeature&&f.available!==false)))errors.push('Unrelated bundle content');
  for(const n of linked){const box=JSON.parse(n.closest('[data-element-id]').dataset.elementBox);if(box.x<0||box.y<0||box.x+box.width>960||box.y+box.height>540)errors.push('Cropped bundle visual');if(!['feature','mood'].includes(n.dataset.bundleRole))errors.push('Nonvisual bundle filler');}
  if(source.bundle.media.cornerRadius&&Number(head.querySelector('clipPath rect')?.getAttribute('rx'))!==source.bundle.media.cornerRadius)errors.push('Asset outline lost');
 }
 for(const id of ['focus','focus2','focus3']){
  const a=original(id,0).querySelector('[data-background-motion]'),b=original(id,12).querySelector('[data-background-motion]');
  if(!a||!b||a.getAttribute('x')===b.getAttribute('x'))errors.push('Static feature background '+id);
 }
 const glyphs=f=>[...original('ending',f).querySelectorAll('[data-symbol]')].map(n=>n.dataset.symbol).join(',');
 if(glyphs(0)!==glyphs(1)||glyphs(0)===glyphs(2)||glyphs(2)===glyphs(3)||glyphs(3)!==glyphs(4))errors.push('Wrong held glyph cadence');

 for(const mode of ['default','minimum','maximum','mixed']){
  const adjusted=structuredClone(p);adjusted.showcase.motion={version:1,shots:{}};
  for(const [i,id]of MOTION_SHOTS.entries())adjusted.showcase.motion.shots[id]=mode==='default'?{}:Object.fromEntries(controlsFor(id).map(key=>[key,MOTION_FIELDS[key][mode==='minimum'?'min':mode==='maximum'?'max':i%2?'min':'max']]));
  for(const shot of SHOWCASE_SHOTS)for(let frame=0;frame<shot.frames;frame++){
   const svg=renderShot(shot.id,frame,adjusted,{wireframe:false});frames++;
   if(/NaN|Infinity/.test(svg.outerHTML)||[...svg.querySelectorAll('[width],[height]')].some(n=>['width','height'].some(k=>Number(n.getAttribute(k))<0)))errors.push('Invalid adjusted geometry '+shot.id+'/'+frame);
   const ids=[...svg.querySelectorAll('[data-element-id]')].map(n=>n.dataset.elementId);if(ids.length!==new Set(ids).size)errors.push('Duplicate layer IDs '+shot.id);
   for(const n of svg.querySelectorAll('rect,text,image,path,line,circle,polygon'))if(!n.closest('[data-element-id]'))errors.push('Uneditable primitive '+shot.id+'/'+n.tagName);
  }
 }
 let cutChecks=0;
 for(const cutType of Object.keys(CUT_TYPES))for(const cutFrames of [2,6,12]){
  const adjusted=structuredClone(p);adjusted.showcase.motion={version:1,shots:Object.fromEntries(MOTION_SHOTS.filter(id=>id!=='ending').map(id=>[id,{cutType,cutFrames}]))};let boundary=0;
  for(let i=1;i<SHOWCASE_SHOTS.length;i++){
   boundary+=SHOWCASE_SHOTS[i-1].frames;
   for(let f=0;f<=cutFrames;f++){
    const svg=renderSequenceFrame(MOTION_SHOTS,boundary+f,adjusted,{wireframe:false});cutChecks++;
    if(/NaN|Infinity/.test(svg.outerHTML))errors.push('Invalid cut '+cutType);
    if(cutType!=='cut'&&f<cutFrames-1&&svg.dataset.cutType!==cutType)errors.push('Missing chosen cut '+cutType);
    if((cutType==='cut'||f>=cutFrames-1)&&svg.outerHTML!==renderShot(SHOWCASE_SHOTS[i].id,f,adjusted,{wireframe:false}).outerHTML)errors.push('Cut endpoint changed '+cutType);
   }
  }
 }
 const adjusted=structuredClone(p);adjusted.showcase.motion={version:1,shots:{},elements:{focus:{headline:{dx:12.1,dy:-3,sx:1.2,sy:1.2,px:182,py:87},number:{hidden:true}}}};
 for(const f of [0,12,23]){const svg=renderShot('focus',f,adjusted,{wireframe:false});if(!svg.querySelector('[data-element-id="headline"]').getAttribute('transform').includes('12.1 -3')||svg.querySelector('[data-element-id="number"]').getAttribute('visibility')!=='hidden')errors.push('Element edits lost in playback');if(svg.querySelector('#element-overlay'))errors.push('Editor handles leaked into render');}
 const player=await createMotionPlayer(fixture,{payload:p,sequence:SHOWCASE_SHOTS.map(s=>s.id),wireframe:false});let start=0;
 for(const shot of SHOWCASE_SHOTS){player.seekFrame(start);if(player.getState().shot!==shot.id)errors.push('Wrong cut '+shot.id);start+=shot.frames;}
 if(player.getState().duration!==19)errors.push('Wrong duration');player.seekFrame(227);if(!fixture.textContent.includes('Proudly built on')||fixture.querySelectorAll('image').length!==2)errors.push('Ending changed');
 player.setShot('focus2');player.setVariant('focus2','six-week');player.seekFrame(23);if(!fixture.textContent.includes('Find')&&!fixture.textContent.includes('Your'))errors.push('Wrong feature title');if(player.getVariants().focus==='six-week')errors.push('Second feature layout changed first feature');
 player.setMotion({version:1,shots:{focus2:{tempo:.7,hover:10}}});if(player.getPayload().showcase.motion.shots.focus2.hover!==10)errors.push('Player discarded motion settings');
 const first=structuredClone(p),last=structuredClone(p);first.showcase.description='First description';last.showcase.description='Latest description';await Promise.all([player.update(first),player.update(last)]);if(player.getPayload().showcase.description!=='Latest description')errors.push('Latest update lost');
 const invalid=structuredClone(p);invalid.showcase.features[0].media.src='/missing-image.jpg';let rejected=false;try{await player.update(invalid);}catch{rejected=true;}if(!rejected||player.getPayload().showcase.description!=='Latest description')errors.push('Broken source replaced the working player');
 const baseline=structuredClone(p);delete baseline.showcase;await player.update(baseline);player.setSequence(SHOTS.map(s=>s.id));if(player.getState().duration!==15)errors.push('Legacy sequence compatibility failed');
 player.destroy();fixture.replaceChildren(renderShot('focus',23,p,{wireframe:false}));result.textContent=JSON.stringify({status:errors.length?'FAIL':'PASS',frames,cutChecks,duration:19,checks:['Asset identity, outline and exact match-cut geometry','Related asset associations','Separate capability headlines','Attached connectors follow image geometry and saved edits','Animated feature background type','Held glyph flicker cadence','Original player and renderer integration','All existing layouts across eight shots','Landscape, portrait and square pages remain whole','Restored opening, capability flip and ending cadence','All cut types and durations','Editable layer coverage and unique IDs','Element transformations persist during animation','8 exact cuts','Fixed ending','Independent feature layouts','Newest update wins','Missing source rejected','Original 15-second payload compatibility'],errors},null,2);
}catch(e){result.textContent='FAIL '+e.stack;}};
</script></body></html>
