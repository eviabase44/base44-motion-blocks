<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card layout library · Base44</title><link rel="stylesheet" href="studio.css"><style>main{max-width:1600px;padding-bottom:64px}.library-top{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:40px 0 32px}.library-top h1{font-size:36px}.library-controls{display:flex;gap:10px;align-items:center}.library-controls select{width:150px}.library-controls button{border:1px solid #cfd3c7;padding:10px 14px;white-space:nowrap}.library-row{margin:30px 0}.library-row h2{font-size:17px;letter-spacing:-.3px}.library-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.library-card{min-width:0}.library-card .image{aspect-ratio:16/9;overflow:hidden}.library-card h3{font-size:13px;font-weight:550;margin:10px 0 5px}.library-card p{font-size:11px;color:#7b8372;margin:0 0 7px}.library-card a{font-size:11px}.library-row:last-child .library-grid{grid-template-columns:repeat(4,minmax(0,1fr))}#status{font-size:11px;color:#7b8372}@media(max-width:900px){.library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.library-top{display:block}.library-controls{margin-top:24px}.library-row:last-child .library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.library-controls{flex-wrap:wrap}.library-grid{grid-template-columns:1fr}}
</style></head><body><main><header class="topbar"><a class="wordmark" href="./">Motion blocks<span> / Layout library</span></a><a class="docs-link" href="./">Back to editor ↗</a></header><div class="library-top"><div><div class="eyebrow">4 ORIGINALS · 12 SOURCE RECONSTRUCTIONS · 1 FIXED END CARD</div><h1>Built from Base44 reference shots.</h1></div><div class="library-controls"><select id="library-profile" aria-label="Library app"><option value="wireframe">Wireframe</option><option value="forma">Forma</option><option value="atlas">Atlas</option></select><button id="replay">Play all</button><button id="hold">Show final poses</button></div></div><p id="status" role="status">Loading…</p><div id="library"></div></main><script type="module">
import {SHOTS,FPS,renderShot,loadAppFont} from './src/player.js';
import {SHOT_VARIANTS} from './src/variants.js';
import {makeProfile} from './src/data/profiles.js';
let profile='wireframe',payload,items=[],raf=0,start=0,last=-1,ticket=0;
const library=document.querySelector('#library'),status=document.querySelector('#status');
function draw(frame=null){for(const item of items)item.mount.replaceChildren(renderShot(item.shot.id,frame===null?item.shot.frames-1:Math.min(frame,item.shot.frames-1),payload,{variant:item.variant.id}));}
function hold(){cancelAnimationFrame(raf);draw();status.textContent='12 source reconstructions for review · Your 4 originals and fixed end card retained · Final poses';}
function tick(now){const frame=Math.floor((now-start)*FPS/1000);if(frame!==last){draw(frame);last=frame;}if(frame<45)raf=requestAnimationFrame(tick);else status.textContent='Playback complete · 12 fps · Original shot durations';}
async function build(){const current=++ticket;cancelAnimationFrame(raf);const next=makeProfile(profile);await loadAppFont(next);if(current!==ticket)return;payload=next;items=[];library.replaceChildren();for(const shot of SHOTS){const section=document.createElement('section');section.className='library-row';const heading=document.createElement('h2');heading.textContent=shot.name+(shot.id==='ending'?' · Fixed':' · Four layouts');section.append(heading);const grid=document.createElement('div');grid.className='library-grid';for(const variant of SHOT_VARIANTS[shot.id]){const card=document.createElement('article');card.className='library-card';const mount=document.createElement('div');mount.className='image';mount.setAttribute('data-review',shot.id+':'+variant.id);const title=document.createElement('h3');title.textContent=variant.name;const desc=document.createElement('p');desc.textContent=variant.description;const link=document.createElement('a');link.href='./?'+new URLSearchParams({app:profile,shot:shot.id,layouts:variant.id==='original'?'':shot.id+':'+variant.id});link.textContent='Open in editor ↗';card.append(mount,title,desc,link);grid.append(card);items.push({shot,variant,mount});}section.append(grid);library.append(section);}hold();}
document.querySelector('#library-profile').onchange=event=>{profile=event.target.value;build().catch(error=>status.textContent=error.message);};document.querySelector('#replay').onclick=()=>{cancelAnimationFrame(raf);start=performance.now();last=-1;status.textContent='Playing all layouts';raf=requestAnimationFrame(tick);};document.querySelector('#hold').onclick=hold;await build();
</script></body></html>
